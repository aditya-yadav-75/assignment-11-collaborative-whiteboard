<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Collaborative Whiteboard | Raj Rasal (150096725066)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand">
      <span>🎨 CollabBoard Live</span>
      <span class="brand-badge">Socket.io Engine</span>
    </div>

    <!-- Room Selection -->
    <div class="room-bar">
      <input type="text" id="room-input" placeholder="Enter Room ID" />
      <button id="btn-join-room">Switch Board</button>
    </div>

    <!-- Active Collaborators Roster -->
    <div class="active-users-bar">
      <span>Collaborating:</span>
      <div id="active-users" style="display: flex; gap: 6px;"></div>
      <span style="margin-left: 8px; font-weight: 600;">You: <span id="display-username" style="color: #60a5fa;"></span></span>
    </div>
  </header>

  <!-- Drawing Area -->
  <div class="canvas-container">
    <div id="cursor-container"></div>
    <canvas id="whiteboard"></canvas>
  </div>

  <!-- Floating Toolkit -->
  <div class="floating-toolbar">
    <!-- Tool select -->
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen" title="Pen Brush">✏️</button>
      <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
    </div>

    <div class="divider"></div>

    <!-- Color Palette -->
    <div class="color-picker-group">
      <div class="color-swatch active" style="background: #ffffff;" data-color="#ffffff"></div>
      <div class="color-swatch" style="background: #ef4444;" data-color="#ef4444"></div>
      <div class="color-swatch" style="background: #3b82f6;" data-color="#3b82f6"></div>
      <div class="color-swatch" style="background: #10b981;" data-color="#10b981"></div>
      <div class="color-swatch" style="background: #f59e0b;" data-color="#f59e0b"></div>
      <div class="color-swatch" style="background: #ec4899;" data-color="#ec4899"></div>
    </div>

    <div class="divider"></div>

    <!-- Stroke Thickness -->
    <div class="tool-group">
      <span style="font-size: 0.8rem; color: #94a3b8;">Size</span>
      <input type="range" id="size-slider" class="stroke-slider" min="1" max="30" value="3" />
    </div>

    <div class="divider"></div>

    <!-- Action Buttons -->
    <div class="tool-group">
      <button id="btn-undo" class="tool-btn" title="Undo Last Stroke">↩️</button>
      <button id="btn-clear" class="tool-btn" title="Clear Canvas">🗑️</button>
      <button id="btn-save" class="tool-btn" title="Export PNG Image">💾</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
